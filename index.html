<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Club 41 Übersicht</title>
<meta name="apple-mobile-web-app-title" content="Club 41">
<link rel="apple-touch-icon" href="bilder/symbol-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="bilder/symbol-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="bilder/symbol-32.png">
<meta name="description" content="Termine, Anmeldungen und Rundschreiben des Club 41 Grieskirchen-Hausruck.">
<meta property="og:type" content="website">
<meta property="og:locale" content="de_AT">
<meta property="og:site_name" content="Club 41 Grieskirchen-Hausruck">
<meta property="og:title" content="Club 41 Übersicht">
<meta property="og:description" content="Termine, Anmeldungen und Rundschreiben des Club 41 Grieskirchen-Hausruck.">
<meta property="og:image" content="https://hanspeter-meissl.github.io/c41-clubseite/bilder/symbol-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  .hinweis {
    max-width: 640px; margin: 0 auto; padding: 40px 16px; color: #1D2733;
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  }
  .hinweis img { width: 72px; height: 72px; }
  .hinweis h1 { font: 400 26px/1.2 Georgia, serif; color: #1F3864; margin: 16px 0 8px; }
  /* Ladeanzeige über dem Rahmen, bis Google die Clubseite geliefert hat. Farben wie in Code.gs. */
  .laden {
    position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; padding: 16px; background: #F4F6F9; color: #1d1d1f; text-align: center;
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; transition: opacity .3s;
  }
  .laden.fertig { opacity: 0; pointer-events: none; }
  .laden img { width: 96px; height: 96px; border-radius: 22px; }
  .laden .club { color: #D19B5D; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .laden .rad {
    width: 34px; height: 34px; border-radius: 50%; border: 4px solid #E3E7EE; border-top-color: #154381;
    border-right-color: #D19B5D; animation: drehen .9s linear infinite;
  }
  @keyframes drehen { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .laden .rad { animation-duration: 3s; } }
  .laden .text { font-weight: 600; color: #154381; }
  .laden .zusatz { max-width: 300px; font-size: 14px; color: #595959; }
  .laden [hidden] { display: none; }
  .laden button {
    font: inherit; font-weight: 600; border: 0; border-radius: 20px; padding: 8px 18px;
    background: #D19B5D; color: #1d1d1f; cursor: pointer;
  }
</style>
</head>
<body>
<noscript><div class="hinweis">Diese Seite braucht JavaScript.</div></noscript>
<script>
// Einstiegsseite der Clubseite. Sie trägt das Symbol für den Home-Bildschirm, das die Google-Web-App nicht
// setzen kann, und zeigt die Web-App darin an. Der Clubschlüssel steht im Link hinter dem „#“: Dieser Teil geht
// nicht an GitHub und steht nicht in diesem öffentlichen Repository.
// Link: https://hanspeter-meissl.github.io/c41-clubseite/#<Clubschlüssel>, wahlweise #<Clubschlüssel>&teil=termine
const GOOGLE = 'https://script.google.com/macros/s/AKfycbwA6RqLDdoVVz6Qzi1ovLaQONPdTYP92pCApP5XdqMyPqjxwCo1kUpnUeOiNfIeRehJ/exec';
const SPEICHER = 'c41-clubschluessel';

function speichern(club) {
  try { localStorage.setItem(SPEICHER, club); } catch (e) {}
}
function gespeichert() {
  try { return localStorage.getItem(SPEICHER) || ''; } catch (e) { return ''; }
}

const teile = location.hash.slice(1).split('&');
let club = /^[\w-]{8,}$/.test(teile[0]) ? teile[0] : '';
const teil = new URLSearchParams(teile.slice(1).join('&')).get('teil');

if (club) {
  speichern(club);
} else {
  // Ohne Schlüssel im Link den zuletzt verwendeten nehmen und in die Adresse zurückschreiben,
  // damit ein Lesezeichen von hier aus wieder vollständig ist.
  club = gespeichert();
  if (club) history.replaceState(null, '', '#' + club);
}

if (club) {
  // Google rechnet die Seite erst fertig (Zahlen aller Vorhaben, Termine, Rundschreiben) und liefert sie dann
  // auf einmal. Bis dahin bliebe der Rahmen weiß, deshalb steht so lange die Ladeanzeige darüber.
  document.body.insertAdjacentHTML('beforeend', `<div class="laden" role="status" aria-live="polite">
<img src="bilder/symbol-192.png" alt="">
<div class="club">Club 41 Grieskirchen-Hausruck</div>
<div class="rad" aria-hidden="true"></div>
<div class="text">Übersicht wird geladen</div>
<div class="zusatz" hidden>Die aktuellen Zahlen werden bei den Anmeldungen abgefragt. Das dauert einige Sekunden.</div>
<div class="zusatz" hidden>Das dauert länger als üblich.</div>
<button type="button" hidden>Neu laden</button></div>`);
  const laden = document.querySelector('.laden');
  const [lang, sehrLang] = laden.querySelectorAll('.zusatz');
  const knopf = laden.querySelector('button');
  const uhren = [
    setTimeout(() => { lang.hidden = false; }, 4000),
    setTimeout(() => { lang.hidden = true; sehrLang.hidden = false; knopf.hidden = false; }, 30000),
  ];
  knopf.addEventListener('click', () => location.reload());

  const f = document.createElement('iframe');
  f.title = 'Club 41 Übersicht';
  f.addEventListener('load', () => {
    uhren.forEach(clearTimeout);
    laden.classList.add('fertig');
    setTimeout(() => laden.remove(), 400);
  }, { once: true });
  f.src = GOOGLE + '?club=' + encodeURIComponent(club) + (teil ? '&teil=' + encodeURIComponent(teil) : '');
  document.body.appendChild(f);
} else {
  document.body.insertAdjacentHTML('beforeend', `<div class="hinweis">
<img src="bilder/symbol-192.png" alt="Club 41 Österreich">
<h1>Club 41 Übersicht</h1>
<p>Bitte öffne die Seite über den Link aus der WhatsApp-Community des Clubs.</p></div>`);
}
// Ein neuer Link in einem schon offenen Tab ändert nur den Teil hinter dem „#“ und lädt die Seite sonst nicht neu.
addEventListener('hashchange', () => location.reload());
</script>
</body>
</html>
